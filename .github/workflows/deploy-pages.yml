name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Fail if test discovery collapsed
        shell: bash
        run: |
          total=$(sed -n 's/^.*[[:space:]]tests[[:space:]]\([0-9]\{1,\}\)$/\1/p' test-output.txt | tail -1)
          echo "Discovered tests: ${total:-0}"
          if [ "${total:-0}" -lt 400 ]; then
            echo "::error::Expected at least 400 tests, found ${total:-0}. Test discovery may have silently broken."
            exit 1
          fi

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static site bundle
        run: |
          mkdir dist
          cp index.html dist/
          cp styles.css dist/
          cp app.js dist/
          cp -r app dist/
          cp vocab-data.js dist/
          cp abbreviation-data.js dist/
          cp sentence-bank-data.js dist/
          cp hebrew-verbs.js dist/
          cp preposition-data.js dist/
          cp verb-game-data.js dist/
          cp hebrew-idioms.js dist/
          cp handwriting-data.js dist/
          cp .nojekyll dist/
          cp -r assets dist/

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
